"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = "everforest_dark"

format = "$os$hostname${custom.dir_icon}$directory$git_branch$git_status$nodejs$python$lua${custom.html}${custom.css}$rust$golang$php$character"
right_format = "$jobs$cmd_duration$time"

[palettes.everforest_dark]
bg_dim = "#232A2E"
bg0 = "#2D353B"
bg1 = "#343F44"
bg3 = "#475258"
fg = "#D3C6AA"
red = "#E67E80"
orange = "#E69875"
yellow = "#DBBC7F"
green = "#A7C080"
aqua = "#83C092"
blue = "#7FBBB3"
purple = "#D699B6"
grey0 = "#7A8478"

[os]
disabled = false
format = "[$symbol](fg:blue) "

[os.symbols]
Macos = "\uf179"
Debian = "\uf306"
Ubuntu = "\uef72"
Linux = "\uf17c"
Arch = "\ue732"
EndeavourOS = "\uf322"

[hostname]
ssh_only = true
format = "[@$hostname](fg:orange) "

[directory]
home_symbol       = " ~"
format            = "[$path](fg:fg) "
truncation_length = 2
truncate_to_repo  = true

[git_branch]
symbol = ""
format = "[$symbol $branch](bold fg:purple) "

[git_status]
format     = "([$ahead_behind$staged$modified$untracked$deleted$conflicted](fg:grey0)) "
ahead      = "⇡$count "
behind     = "⇣$count "
diverged   = "⇡$ahead_count⇣$behind_count "
staged     = "+$count "
modified   = "●$count "
untracked  = "…$count "
deleted    = "✘$count "
conflicted = "⚡$count "

[nodejs]
symbol = " "
format = "[$symbol$version](fg:green) "

[python]
symbol = " "
format = "[$symbol$version](fg:yellow) "

[lua]
symbol = " "
format = "[$symbol$version](fg:blue) "

[rust]
symbol = " "
format = "[$symbol$version](fg:red) "

[golang]
symbol = " "
format = "[$symbol$version](fg:blue) "

[php]
symbol = " "
format = "[$symbol$version](fg:purple) "

[cmd_duration]
min_time = 1000
format = "[󰔛 $duration](fg:fg) "

[jobs]
symbol = " "
symbol_threshold = 1
number_threshold = 1
format = "[$symbol$number](fg:blue) "

[time]
disabled = false
time_format = "%H:%M"
format = "[ $time](fg:fg) "

[custom.dir_icon]
symbol = ""
when = ''' test "$PWD" != "$HOME" '''
# sh instead of $STARSHIP_SHELL (zsh): zsh sources ~/.zshenv incl. brew calls
# on every prompt, which timed out on slow mounts like the SMB share
shell = ["sh"]
format = "[$symbol](fg:aqua) "

[custom.html]
symbol = ""
detect_extensions = ["html", "htm"]
format = "[$symbol](fg:orange) "

[custom.css]
symbol = ""
detect_extensions = ["css", "scss", "sass", "less"]
format = "[$symbol](fg:blue) "

[character]
success_symbol = "[❯](fg:green)"
error_symbol   = "[❯](fg:red)"
vimcmd_symbol  = "[❮](fg:blue)"
