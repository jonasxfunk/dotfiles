# ── Terminal / display ───────────────────────────────────────────────
# True color passthrough (WezTerm supports it) — needed so the Everforest
# flavor in yazi/nvim/bat renders correctly instead of washed-out colors.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Let the shell/editor's cursor-shape requests (DECSCUSR, e.g. vi-mode
# beam vs. block) pass through to the real terminal instead of tmux
# falling back to a static block cursor.
set -as terminal-features ",xterm-256color:cstyle"

# Pass through CSI-u "extended key" sequences (e.g. WezTerm's Shift+Enter
# binding, \x1b[13;2u) to the app inside tmux instead of tmux swallowing
# or mangling them — needed for apps that distinguish Shift+Enter from
# plain Enter (e.g. Claude Code).
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

# Default cursor shape: beam instead of tmux's own block default (separate
# from the DECSCUSR passthrough above, which only forwards shapes that
# programs like vim explicitly request).
set -g cursor-style bar

# Let escape-sequence passthrough (Kitty graphics protocol, used for image
# previews in Yazi) through to the real terminal — off by default in tmux.
# Without this, the handshake for it seems to stall the popup on open/close.
set -gq allow-passthrough on
set -g visual-activity off
set -g focus-events on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# ── General behavior ─────────────────────────────────────────────────
set -g mode-keys vi          # vi-style copy mode instead of the emacs default
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g status-position top

# Second, independent bar at the bottom edge — tmux only has one real
# status-line position, but pane borders can carry their own title line at
# the opposite edge. Shows each pane's current directory.
set -g pane-border-status bottom
# tmux gets #{pane_current_path} by inspecting the local OS process table,
# which doesn't reach across an ssh connection — so it'd otherwise keep
# showing the last local path. Show the ssh target instead in that case.
set -g pane-border-format "#{?#{==:#{pane_current_command},ssh},#(~/.config/tmux/scripts/ssh-target.sh '#{pane_tty}') (ssh),#{pane_current_path}}"

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ── Key bindings ─────────────────────────────────────────────────────
unbind r
bind r source-file ~/.config/tmux/tmux.conf   # prefix+r: reload config

# prefix+x: close the current pane without the "kill-pane #P? (y/n)" prompt
unbind x
bind x kill-pane

# Prefix+y: open yazi as a floating popup in the current pane's directory,
# closes automatically when yazi quits.
bind y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"

# vi-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Status bar (Everforest) ──────────────────────────────────────────
# Palette matches the "Everforest Dark (Gogh)" scheme used by WezTerm/nvim
# (see ~/.dotfiles/wezterm/.config/wezterm/constants.lua). Defined as user
# options so the hex codes live in one place and get reused as #{@name} in
# the format strings below.

# Palette: tmux "user options" (the @-prefix), NOT plain shell-style
# variables — a bare `name="value"` line (no `set -g @`) is also valid tmux
# syntax, but it defines a tmux *environment* variable instead (readable as
# #{env:name}, or $name inside run-shell/if-shell) — a different mechanism
# that format strings like window-status-format/status-right below can't
# reference as #{@name}. That's why a previous edit here went silently
# "invisible": the format strings below kept referencing #{@efg_xxx}, which
# no longer existed as user options, so they resolved to nothing.
#
# To experiment with your own colors: either change the hex values here, or
# swap which @name a given #[fg=...]/#[bg=...] below points at. Reload with
# prefix+r to see it. A few extra swatches are defined but unused below —
# reference them (e.g. #{@gray_medium}) in place of any @efg_* to try them.
set -g @efg_bg0    "#2d353b"
set -g @efg_bg1    "#343f44"
set -g @efg_bg2    "#3d484d"
set -g @efg_fg     "#d3c6aa"
set -g @efg_grey1  "#859289"
set -g @efg_green  "#a7c080"
set -g @efg_yellow "#dbbc7f"
set -g @efg_blue   "#7fbbb3"
set -g @efg_cyan   "#81A1C1"
set -g @efg_bg_green "#3C4841"

set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 80
set -g status-style "bg=default,fg=#{@efg_fg}"
set -g status-left "#[fg=#{@efg_green},bold]\uf489 #S #[fg=#{@efg_fg},nobold] | "
set -g status-right "\uf4bc #{cpu} \uefc5 #{mem}     \uf133 %a, %d. %b %Y  \uf017 %H:%M "
# Window name shown here is computed live via scripts/window-name.sh: cwd's
# basename at an idle shell (instead of a flat "zsh"), ssh target while
# connected, open filename while editing in nvim (via #{pane_title}, which
# nvim pushes through its titlestring \u2014 see nvim's core/options.lua).
set -g window-status-current-format "#[fg=#{@efg_blue},bold] \uf444 #[underscore]#I:#(~/.config/tmux/scripts/window-name.sh '#{pane_current_command}' '#{pane_current_path}' '#{pane_title}' '#{pane_tty}')"
set -g window-status-format " #I:#(~/.config/tmux/scripts/window-name.sh '#{pane_current_command}' '#{pane_current_path}' '#{pane_title}' '#{pane_tty}')"
set -g message-style "fg=#{@efg_fg},bg=default"
set -g mode-style "fg=#{@efg_blue},bg=#{@efg_bg2}"
set -g pane-border-style "fg=#{@efg_bg1}"
set -g pane-active-border-style "fg=#{@efg_fg}"
# Right, left to right: current pane mode (copy-mode/clock-mode, hidden
# otherwise; NB commas inside #[] tags break the #{?,,} ternary below, so
# each style attribute needs its own #[...] tag here) · git branch of the
# active pane's cwd (hidden outside a repo) · hostname · date/time ·
# session name (pushed all the way to the right edge)
#set -g status-right-length 100
#set -g status-right "#{?pane_in_mode,#[fg=#{@efg_bg0}]#[bg=#{@efg_yellow}]#[bold] #{pane_mode} #[fg=#{@efg_fg}]#[bg=#{@efg_bg1}]#[nobold] ,}#[fg=#{@efg_yellow}]#(~/.config/tmux/scripts/git-branch.sh '#{pane_current_path}')#[fg=#{@efg_grey1}]  #[fg=#{@efg_blue}]#(~/.config/tmux/scripts/host-status.sh '#{pane_current_command}' '#{pane_tty}') #[fg=#{@efg_grey1}]#[fg=#{@efg_fg}]%d.%m %H:%M #[fg=#{@efg_grey1}] #[fg=#{@efg_bg0}]#[bg=#{@efg_green}]#[bold]  #S "

# ── Plugins (tpm) ────────────────────────────────────────────────────
# Add one `set -g @plugin '...'` line per plugin below, then reload the
# config (prefix+r) and press prefix+I to fetch it. tpm installs plugins
# under ~/.config/tmux/plugins/ automatically (XDG-aware, no ~/.tmux/ used).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# tmux-yank's own default for "copy current line" is also prefix+y, which
# collided with the yazi popup bind above (plugins load last, so it won).
# Keep "y" = yazi and move the line-copy off to prefix+M-y instead.
set -g @yank_line 'M-y'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'
# Initialize TMUX plugin manager (must stay at the very bottom of the file)
run '~/.config/tmux/plugins/tpm/tpm'
